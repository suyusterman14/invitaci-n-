name: Ejecutar Codigo de Claude

on:
  push: # Se ejecutará cada vez que subas cambios
    branches: [ main ]
  workflow_dispatch: # Te permite ejecutarlo manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar el codigo del repo
      uses: actions/checkout@v4

    - name: Configurar el entorno (Ejemplo con Python)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Ejecutar el script generado por Claude
      run: |
        python mi_script_de_claude.py
